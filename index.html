<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c4fd8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Quaderno di Kristian</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
html, body { margin: 0; min-height: 100% }
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
img { max-width: 100% }
[hidden] { display: none !important }
</style>
<style>
/* Layout: app a giornata. Barra della data in alto, sezioni a schede (in basso su telefono, a sinistra su computer). */
:root {
  --bg: #f3f4f7;
  --surface: #ffffff;
  --line: #dfe2ea;
  --fg: #161a24;
  --muted: #5e6578;
  --accent: #2c4fd8;
  --accent-soft: #e6ebfc;
  --goal: #1f8a5b;
  --spend: #b86e00;
  --phone: #c23a62;
  --work: #2c4fd8;
  --danger: #c0352b;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f121a; --surface: #181c27; --line: #2a3040; --fg: #e8ebf2; --muted: #9aa1b4;
  --accent: #7d97ff; --accent-soft: #232c4d; --goal: #4cc48d; --spend: #f0a43a; --phone: #f07397; --work: #7d97ff; --danger: #ff7b70;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f121a; --surface: #181c27; --line: #2a3040; --fg: #e8ebf2; --muted: #9aa1b4;
  --accent: #7d97ff; --accent-soft: #232c4d; --goal: #4cc48d; --spend: #f0a43a; --phone: #f07397; --work: #7d97ff; --danger: #ff7b70;
  color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
button, input, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums }

.app { display: grid; grid-template-columns: 1fr; min-height: 100%; padding-bottom: 76px }
.main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 24px; max-width: 760px; width: 100%; margin: 0 auto; display: grid; gap: 16px; align-content: start }

/* Navigazione */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(6, 1fr);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)) }
.tab { background: none; border: 0; border-radius: 10px; padding: 6px 2px; display: grid; justify-items: center; gap: 2px; font-size: 11.5px; color: var(--muted) }
.tab svg { width: 22px; height: 22px }
.tab span { text-align: center; line-height: 1.2 }
.tab[aria-current="page"] { color: var(--fg); background: var(--accent-soft) }
.brand { display: none }
@media (min-width: 860px) {
  .app { grid-template-columns: 220px 1fr; padding-bottom: 0 }
  .tabs { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; border-top: 0; border-right: 1px solid var(--line);
    grid-template-columns: 1fr; align-content: start; gap: 4px; padding: 20px 12px; padding-left: max(12px, env(safe-area-inset-left, 0px)) }
  .tab { grid-auto-flow: column; justify-content: start; gap: 10px; font-size: 15px; padding: 9px 12px }
  .brand { display: block; font-family: var(--font-display); font-weight: 700; font-size: 20px; padding: 0 12px 16px; line-height: 1.15 }
  .main { padding-block: 24px 40px }
}

/* Barra della data */
.daybar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; background: var(--bg); display: flex; align-items: center; gap: 8px; padding-block: 6px }
.daybar h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(22px, 5vw, 30px); margin: 0; flex: 1; min-width: 0; line-height: 1.1; text-wrap: balance }
.daybar h1 small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 13px; color: var(--muted); letter-spacing: .02em }
.iconbtn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center }
.iconbtn svg { width: 18px; height: 18px }
.todaybtn { height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; font-size: 13.5px; font-weight: 500 }

/* Blocchi */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0 }
.panel h2 { font-family: var(--font-display); font-weight: 700; font-size: 19px; margin: 0; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; text-wrap: balance }
.panel h2 .aside { font-family: var(--font-body); font-weight: 500; font-size: 13px; color: var(--muted) }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600 }
.empty { color: var(--muted); font-size: 14px; margin: 0 }

.form { display: flex; flex-wrap: wrap; gap: 8px; align-items: end }
.field { display: grid; gap: 4px; flex: 1 1 120px; min-width: 0 }
.field.wide { flex: 3 1 200px }
.field.tiny { flex: 0 1 84px }
.field label { font-size: 12.5px; color: var(--muted); font-weight: 500 }
input, select { width: 100%; height: 42px; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 0 12px; min-width: 0 }
.btn { height: 42px; border: 0; border-radius: 10px; padding: 0 16px; background: var(--fg); color: var(--surface); font-weight: 600; flex: 0 0 auto }
.btn.ghost { background: var(--accent-soft); color: var(--fg) }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; padding: 3px; background: var(--bg) }
.seg button { border: 0; background: none; border-radius: 7px; padding: 6px 12px; font-size: 13.5px; font-weight: 500; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08) }

.list { list-style: none; margin: 0; padding: 0; display: grid }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); min-width: 0 }
.row:first-child { border-top: 0 }
.row .txt { flex: 1; min-width: 0; overflow-wrap: anywhere }
.row .txt small { display: block; color: var(--muted); font-size: 13px }
.row .val { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap }
.del { border: 0; background: none; color: var(--muted); width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; flex: 0 0 auto }
.del:hover { color: var(--danger); background: var(--bg) }
.del svg { width: 16px; height: 16px }
.check { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: 0 0 auto; padding: 0 }
.check svg { width: 14px; height: 14px; opacity: 0 }
.check[aria-checked="true"] { background: var(--goal); border-color: var(--goal); color: #fff }
.check[aria-checked="true"] svg { opacity: 1 }
.done .txt { color: var(--muted); text-decoration: line-through }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); margin-right: 6px }

/* Riepilogo */
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px }
@media (min-width: 620px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)) } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 4px; text-align: left; border-top: 3px solid var(--c) }
.stat .big { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 24px; line-height: 1.1 }
.stat .sub { font-size: 12.5px; color: var(--muted) }
.progress { height: 8px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); overflow: hidden }
.progress i { display: block; height: 100%; background: var(--goal); border-radius: 99px }

/* Grafico 7 giorni */
.chart { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; height: 150px; padding-top: 18px }
.bar { display: grid; grid-template-rows: auto 1fr auto; height: 100%; gap: 4px; text-align: center; min-width: 0 }
.bar .v { font-family: var(--font-mono); font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden }
.bar .track { display: flex; align-items: end; justify-content: center; border-bottom: 1px solid var(--line) }
.bar .fill { width: 70%; max-width: 34px; border-radius: 6px 6px 0 0; background: var(--c); opacity: .85; min-height: 2px }
.bar.sel .fill { opacity: 1 }
.bar .d { font-size: 12px; color: var(--muted); white-space: nowrap }
.chart.month { gap: 2px; height: 130px; padding-top: 6px }
.chart.month .fill { width: 100%; border-radius: 3px 3px 0 0 }
.chart.month .d { font-size: 11px; overflow: visible }
.chart.month .bar.today .fill { outline: 2px solid var(--fg); outline-offset: 1px }
.chart.six { grid-template-columns: repeat(6, minmax(0, 1fr)) }
.trend { display: grid; gap: 20px; grid-template-columns: 1fr }
@media (min-width: 620px) { .trend { grid-template-columns: repeat(3, minmax(0, 1fr)) } }
.trend > div { display: grid; gap: 4px; min-width: 0 }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 16px; margin: 0 }
.facts div { display: grid; gap: 2px }
.facts dt { font-size: 12.5px; color: var(--muted) }
.facts dd { margin: 0; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 16px }
.bar.sel .d { color: var(--fg); font-weight: 600 }
.hbars { display: grid; gap: 8px }
.hbar { display: grid; grid-template-columns: minmax(0, 8.5em) 1fr 5.5em; gap: 10px; align-items: center; font-size: 14px }
.hbar .t { height: 10px; background: var(--bg); border-radius: 99px; overflow: hidden; border: 1px solid var(--line) }
.hbar .t i { display: block; height: 100%; background: var(--c) }
.hbar span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.hbar .num { text-align: right }

.banner { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 14px; border-radius: var(--r); background: var(--accent-soft); font-size: 14px }
.banner p { margin: 0; flex: 1 1 220px }
.timer { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; background: var(--accent-soft) }
.timer .clock { font-family: var(--font-mono); font-size: 22px; font-variant-numeric: tabular-nums }
.timer .txt { flex: 1 1 140px; min-width: 0 }

.hours { display: flex; flex-wrap: wrap; gap: 6px }
.hour { height: 36px; min-width: 56px; padding: 0 10px; border: 1px solid var(--line); border-radius: 99px; background: var(--bg); font-family: var(--font-mono); font-size: 13px }
.hour[aria-pressed="true"] { background: var(--fg); color: var(--surface); border-color: var(--fg) }
.tones { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px; color: var(--muted) }
.tones b { font-family: var(--font-mono); font-weight: 500; color: var(--fg) }
.catgrid { display: grid; grid-template-columns: minmax(0, 1fr) 64px 64px; gap: 8px 8px; align-items: center }
.catgrid .head { font-size: 12.5px; color: var(--muted); font-weight: 500 }
.catgrid label { font-weight: 500; min-width: 0 }
.catgrid label small { display: block; font-weight: 400; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.catgrid input { padding: 0 8px; text-align: center }
.total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 10px; border-top: 1px solid var(--line); font-weight: 600 }
.total b { font-family: var(--font-mono); font-weight: 500; font-size: 18px }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--surface); padding: 10px 14px; border-radius: 10px; display: flex; gap: 14px; align-items: center; z-index: 20; font-size: 14px; max-width: calc(100% - 32px) }
.toast button { background: none; border: 0; color: inherit; font-weight: 600; text-decoration: underline }
@media (min-width: 860px) { .toast { bottom: 24px } }
@media (prefers-reduced-motion: no-preference) { .fill, .progress i, .hbar .t i { transition: height .3s, width .3s } }
</style>
<style>
.login { min-height: 100vh; display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px }
.login form { width: 100%; max-width: 360px; display: grid; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 24px }
.login h1 { font-family: var(--font-display); font-weight: 700; font-size: 28px; margin: 0; line-height: 1.1 }
.login p { margin: 0; color: var(--muted); font-size: 14px }
.login .err { color: var(--danger) }
.sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--goal) }
.sync[data-s="saving"]::before { background: var(--spend) }
.sync[data-s="error"]::before { background: var(--danger) }
.account { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; color: var(--muted); font-size: 13.5px }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline }
</style>
</head>
<body>
<section class="login" id="login" hidden>
  <form id="f-login">
    <h1>Quaderno di Kristian</h1>
    <p>Accedi con l'account che hai creato su Supabase.</p>
    <div class="field"><label for="l-email">Email</label><input id="l-email" type="email" required autocomplete="username"></div>
    <div class="field"><label for="l-pass">Password</label><input id="l-pass" type="password" required autocomplete="current-password"></div>
    <button class="btn" id="l-btn">Accedi</button>
    <p class="err" id="l-err" hidden></p>
  </form>
</section>


<div class="app" id="app" hidden>
  <nav class="tabs" id="tabs" aria-label="Sezioni">
    <div class="brand">Quaderno<br>di Kristian</div>
  </nav>
  <main class="main" id="main">
    <div class="daybar">
      <button class="iconbtn" id="prev" aria-label="Giorno precedente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <h1 id="daytitle">Oggi</h1>
      <button class="todaybtn" id="today" hidden>Oggi</button>
      <button class="iconbtn" id="next" aria-label="Giorno successivo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <div id="view"></div>
  </main>
</div>
<div class="toast" id="toast" hidden><span id="toastmsg"></span><button id="undo">Annulla</button></div>

<script src="supabase.js"></script>
<script src="config.js"></script>
<script>
(function () {
  const KEY = 'quaderno-v1';
  const PHONE_CATS = [
    ['Social', 'Instagram, TikTok, Facebook'],
    ['Messaggi', 'WhatsApp, Telegram'],
    ['Video e streaming', 'YouTube, Netflix, Twitch'],
    ['Informazione', 'Notizie, Google, Chrome'],
    ['Musica e podcast', 'Spotify'],
    ['Giochi', ''],
    ['Studio e lavoro', 'Email, documenti'],
    ['Altro', 'Tutto il resto']
  ];
  const CATS = ['Cibo', 'Trasporti', 'Svago', 'Casa', 'Salute', 'Abbigliamento', 'Altro'];
  const ICON = {
    oggi: '<path d="M4 5h16v15H4zM4 10h16M9 3v4M15 3v4"/>',
    obiettivi: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".6"/>',
    spese: '<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/>',
    telefono: '<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/>',
    lavoro: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M10 2.5h4"/>',
    riepilogo: '<path d="M4 20V11M10 20V5M16 20v-6M21 20H3"/>'
  };
  const TABS = [['oggi', 'Oggi'], ['obiettivi', 'Obiettivi'], ['spese', 'Spese'], ['telefono', 'Utilizzo telefono'], ['lavoro', 'Lavoro'], ['riepilogo', 'Riepilogo']];
  const svg = (p) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  const X = svg('<path d="M6 6l12 12M18 6L6 18"/>');
  const TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  // ---------- date ----------
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const parse = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
  const monday = (s) => { const d = parse(s); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return iso(d); };
  const weekDays = (s) => { const m = monday(s); return [0, 1, 2, 3, 4, 5, 6].map((i) => addDays(m, i)); };
  const todayIso = () => iso(new Date());
  const monthStart = (s) => s.slice(0, 8) + '01';
  const addMonths = (s, n) => { const d = parse(monthStart(s)); d.setMonth(d.getMonth() + n); return iso(d); };
  const monthDays = (s) => { const out = []; let d = monthStart(s); while (d.slice(0, 7) === s.slice(0, 7)) { out.push(d); d = addDays(d, 1); } return out; };
  const fmtMonth = (s) => parse(monthStart(s)).toLocaleDateString('it-IT', { month: 'long', year: 'numeric' });
  const fmtMonthShort = (s) => parse(monthStart(s)).toLocaleDateString('it-IT', { month: 'short' }).replace('.', '');
  const cap = (t) => t.charAt(0).toUpperCase() + t.slice(1);
  const fmtLong = (s) => parse(s).toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
  const fmtShortDay = (s) => parse(s).toLocaleDateString('it-IT', { weekday: 'short' }).replace('.', '');
  const fmtDM = (s) => parse(s).toLocaleDateString('it-IT', { day: 'numeric', month: 'short' });

  // ---------- formati ----------
  const eur = (n) => n.toLocaleString('it-IT', { style: 'currency', currency: 'EUR' });
  const hm = (min) => { min = Math.round(min || 0); const h = Math.floor(min / 60), m = min % 60; return h ? `${h}h ${String(m).padStart(2, '0')}m` : `${m}m`; };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

  // ---------- dati ----------
  function emptyData() { return { goals: [], expenses: [], phone: {}, work: [], timer: null, example: false }; }
  function sampleData() {
    const t = todayIso(), y = addDays(t, -1), w = monday(t);
    const d = emptyData();
    d.example = true;
    d.goals = [
      { id: uid(), text: 'Allenamento 30 minuti', type: 'day', date: t, done: true },
      { id: uid(), text: 'Leggere 20 pagine', type: 'day', date: t, done: false },
      { id: uid(), text: 'Finire la prima versione dell\'app', type: 'week', date: w, done: false },
      { id: uid(), text: 'Stare sotto le 3 ore di telefono al giorno', type: 'week', date: w, done: false }
    ];
    d.expenses = [
      { id: uid(), date: t, amount: 1.4, cat: 'Cibo', note: 'Caffè' },
      { id: uid(), date: t, amount: 12.9, cat: 'Cibo', note: 'Spesa' },
      { id: uid(), date: y, amount: 35, cat: 'Trasporti', note: 'Benzina' },
      { id: uid(), date: addDays(t, -2), amount: 18, cat: 'Svago', note: 'Cinema' }
    ];
    [212, 175, 240, 160, 198, 225, 150].forEach((m, i) => { d.phone[addDays(t, -i)] = { min: m, unlocks: 60 + i * 7 }; });
    d.work = [
      { id: uid(), date: t, project: 'App web personale', min: 95, note: 'Prototipo sezioni' },
      { id: uid(), date: y, project: 'App web personale', min: 60, note: '' },

  // Copia locale: l'app si apre subito anche senza rete, poi si allinea con Supabase.

  const b64u = (s) => { const b = atob((s + '='.repeat((4 - (s.length % 4)) % 4)).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, (c) => c.charCodeAt(0)); };
  // Segna che oggi hai aperto l'app: la notifica serale parte solo se questo non è successo.

    try {
      const { data: row } = await sb.from('promemoria').select('attivo, ore').eq('user_id', userId).maybeSingle();
      if (row) { rem.attivo = !!row.attivo; if (Array.isArray(row.ore) && row.ore.length) rem.ore = row.ore; }
      if (pushOk()) { const reg = await navigator.serviceWorker.getRegistration(); rem.device = !!(reg && await reg.pushManager.getSubscription()); }

  async function remOn() {

      const reg = await navigator.serviceWorker.ready;
      const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(cfg.vapidPublicKey) });
      const j = sub.toJSON();
      let r = await sb.from('dispositivi').upsert({ endpoint: j.endpoint, user_id: userId, subscription: j });
      if (r.error) throw r.error;
      r = await sb.from('promemoria').upsert({ user_id: userId, attivo: true, ore: rem.ore });
      if (r.error) throw r.error;
      rem.attivo = rem.device = rem.on = true;

  // Minuti per categoria in un insieme di giorni. I giorni salvati prima delle categorie vanno in "Altro".
  function phoneByCat(days) {

      const byProj = {};
      data.work.filter((w) => days.includes(w.date)).forEach((w) => { byProj[w.project] = (byProj[w.project] || 0) + w.min; });
      const projs = Object.entries(byProj).sort((a, b) => b[1] - a[1]);

      const goals = data.goals.filter((g) => (g.type === 'day' && days.includes(g.date)) || (g.type === 'week' && days.includes(g.date)));
      const gDone = goals.filter((g) => g.done).length;
      const gPct = goals.length ? Math.round((gDone / goals.length) * 100) : 0;

      const months = [5, 4, 3, 2, 1, 0].map((i) => addMonths(day, -i));
      const sel = monthStart(day);
      const mSpend = months.map((m) => sum(monthDays(m), spentOn));
      const mWork = months.map((m) => sum(monthDays(m), workOn));
      const mPhone = months.map((m) => { const v = monthDays(m).map(phoneOn).filter((x) => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0; });
      const dayName = (d) => `${Number(d.slice(8))} ${fmtMonthShort(d)}`;

      return `
      <div class="stats">
        <div class="stat" style="--c:var(--goal)"><span class="label">Obiettivi</span><span class="big">${gPct}%</span><span class="sub">${gDone} di ${goals.length} completati</span></div>
        <div class="stat" style="--c:var(--spend)"><span class="label">Spese</span><span class="big">${eur(spend)}</span><span class="sub">${eur(spend / nDays)} al giorno</span></div>
        <div class="stat" style="--c:var(--phone)"><span class="label">Utilizzo telefono</span><span class="big">${phoneVals.length ? hm(phoneAvg) : '—'}</span><span class="sub">media al giorno</span></div>
        <div class="stat" style="--c:var(--work)"><span class="label">Lavoro</span><span class="big">${hm(work)}</span><span class="sub">in ${workDays} ${workDays === 1 ? 'giorno' : 'giorni'}</span></div>
      </div>
      <section class="panel">
        <h2>Spese <span class="aside num">${eur(spend)}</span></h2>
        <span class="label">${vs(spend, spendPrev, eur)}</span>
        ${monthChart(day, spentOn, eur, '--spend')}
        ${cats.length ? `<span class="label">Per categoria</span>${hbars(cats, eur, '--spend')}` : '<p class="empty">Nessuna spesa in questo mese.</p>'}
        ${topExp ? `<dl class="facts"><div><dt>Spesa più alta</dt><dd>${eur(topExp.amount)}</dd></div><div><dt>Di cosa</dt><dd style="font-family:var(--font-body)">${esc(topExp.note || topExp.cat)} · ${dayName(topExp.date)}</dd></div></dl>` : ''}
      </section>
      <section class="panel">
        <h2>Utilizzo telefono <span class="aside">${phoneVals.length} ${phoneVals.length === 1 ? 'giorno inserito' : 'giorni inseriti'}</span></h2>
        <span class="label">${phoneVals.length ? vs(Math.round(phoneAvg), Math.round(phonePrevAvg), hm) : 'Nessun dato in questo mese'}</span>
        ${monthChart(day, phoneOn, hm, '--phone')}
        ${phoneVals.length ? `<dl class="facts"><div><dt>Media al giorno</dt><dd>${hm(phoneAvg)}</dd></div><div><dt>Giorno con più uso</dt><dd>${hm(phoneMax[1])} · ${dayName(phoneMax[0])}</dd></div><div><dt>Giorno con meno uso</dt><dd>${hm(phoneMin[1])} · ${dayName(phoneMin[0])}</dd></div></dl>` : ''}
        ${phoneVals.length ? `<span class="label">Per categoria, media al giorno</span>${hbars(phoneByCat(days).map(([k, v]) => [k, v / phoneVals.length]), hm, '--phone')}` : ''}
      </section>
      <section class="panel">
        <h2>Lavoro sui progetti <span class="aside num">${hm(work)}</span></h2>
        <span class="label">${vs(work, workPrev, hm)}</span>
        ${monthChart(day, workOn, hm, '--work')}
        ${projs.length ? `<span class="label">Per progetto</span>${hbars(projs, hm, '--work')}` : '<p class="empty">Nessun tempo registrato in questo mese.</p>'}
        ${workDays ? `<dl class="facts"><div><dt>Media nei giorni lavorati</dt><dd>${hm(work / workDays)}</dd></div><div><dt>Giorni lavorati</dt><dd>${workDays} su ${nDays}</dd></div></dl>` : ''}
      </section>
      <section class="panel">
        <h2>Ultimi 6 mesi</h2>
        <div class="trend">
          <div><span class="label">Spese</span>${sixChart(months, mSpend, (v) => Math.round(v) + '€', '--spend', sel)}</div>
          <div><span class="label">Utilizzo telefono, media al giorno</span>${sixChart(months, mPhone, hm, '--phone', sel)}</div>
          <div><span class="label">Ore di lavoro</span>${sixChart(months, mWork, (v) => Math.round(v / 60) + 'h', '--work', sel)}</div>
        </div>
      </section>`;
    },

    lavoro(day) {
      const list = data.work.filter((w) => w.date === day);
      const days = weekDays(day);
      const byProj = {};
      data.work.filter((w) => days.includes(w.date)).forEach((w) => { byProj[w.project] = (byProj[w.project] || 0) + w.min; });
      const projs = Object.entries(byProj).sort((a, b) => b[1] - a[1]);
      const known = [...new Set(data.work.map((w) => w.project))];
      return `
      ${timerBlock(known)}
      <section class="panel">
        <h2>Aggiungi tempo a mano</h2>
        <form class="form" id="f-work">
          <div class="field wide"><label for="w-proj">Progetto</label><input id="w-proj" required list="projlist" maxlength="60" placeholder="Es. App web personale" autocomplete="off"></div>
          <div class="field tiny"><label for="w-h">Ore</label><input id="w-h" type="number" min="0" max="24" inputmode="numeric" placeholder="0"></div>
          <div class="field tiny"><label for="w-m">Minuti</label><input id="w-m" type="number" min="0" max="59" inputmode="numeric" placeholder="0"></div>
          <div class="field wide"><label for="w-note">Cosa hai fatto</label><input id="w-note" maxlength="100" placeholder="Facoltativo" autocomplete="off"></div>
          <button class="btn">Aggiungi</button>
        </form>
        <datalist id="projlist">${known.map((p) => `<option value="${esc(p)}">`).join('')}</datalist>
      </section>
      <section class="panel">
        <h2>Lavoro del giorno <span class="aside num">${hm(workOn(day))}</span></h2>
        ${list.length ? `<ul class="list">${list.map((w) => `<li class="row"><span class="txt">${esc(w.project)}${w.note ? `<small>${esc(w.note)}</small>` : ''}</span><span class="val">${hm(w.min)}</span>${delBtn('work', w.id)}</li>`).join('')}</ul>` : '<p class="empty">Nessun tempo registrato in questo giorno.</p>'}
      </section>
      <section class="panel">
        <h2>Settimana <span class="aside num">${hm(projs.reduce((a, p) => a + p[1], 0))}</span></h2>
        ${chart(day, workOn, hm, '--work')}
        ${projs.length ? `<span class="label">Per progetto</span>${hbars(projs, hm, '--work')}` : ''}
      </section>`;
    }
  };

  function timerBlock(known) {
    const t = data.timer;
    if (t) {
      return `<div class="timer"><span class="txt"><span class="label">In corso</span><br>${esc(t.project)}</span>
        <span class="clock" id="clock">${clockText()}</span><button class="btn" data-timer="stop">Ferma e salva</button></div>`;
    }
    if (!known) return '';
    return `<section class="panel"><h2>Cronometro</h2>
      <form class="form" id="f-timer">
        <div class="field wide"><label for="t-proj">Su cosa lavori adesso?</label><input id="t-proj" required list="projlist" maxlength="60" placeholder="Es. App web personale" autocomplete="off"></div>
        <button class="btn">Avvia</button>
      </form></section>`;
  }
  function clockText() {
    if (!data.timer) return '';
    const s = Math.max(0, Math.floor((Date.now() - data.timer.start) / 1000));
    return [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map((n) => String(n).padStart(2, '0')).join(':');
  }
  setInterval(() => { const c = document.getElementById('clock'); if (c) c.textContent = clockText(); }, 1000);

  // ---------- render ----------
  const $ = (id) => document.getElementById(id);
  function render() {
    const tabs = $('tabs');
    tabs.querySelectorAll('.tab').forEach((n) => n.remove());
    TABS.forEach(([k, label]) => {
      const b = document.createElement('button');
      b.className = 'tab'; b.dataset.tab = k;
      if (st.tab === k) b.setAttribute('aria-current', 'page');
      b.innerHTML = svg(ICON[k]) + `<span>${label}</span>`;
      tabs.appendChild(b);
    });
    const monthly = st.tab === 'riepilogo';
    const isToday = monthly ? monthStart(st.day) === monthStart(todayIso()) : st.day === todayIso();
    const rel = st.day === addDays(todayIso(), -1) ? 'Ieri' : st.day === todayIso() ? 'Oggi' : '';
    if (monthly) $('daytitle').innerHTML = `<small>Riepilogo del mese</small>${esc(cap(fmtMonth(st.day)))}`;
    else $('daytitle').innerHTML = `<small>${rel ? rel : TABS.find((t) => t[0] === st.tab)[1]}</small>${esc(cap(fmtLong(st.day)))}`;
    $('today').hidden = isToday;
    $('today').textContent = monthly ? 'Questo mese' : 'Oggi';
    $('prev').setAttribute('aria-label', monthly ? 'Mese precedente' : 'Giorno precedente');
    $('next').setAttribute('aria-label', monthly ? 'Mese successivo' : 'Giorno successivo');
    const banner = data.example ? `<div class="banner"><p>Stai guardando dati di esempio per vedere come funziona l'app.</p><button class="btn" data-clear-example>Cancella esempi e inizia</button></div>` : '';
    const focusId = document.activeElement && document.activeElement.id;
    const account = `<div class="account"><span class="sync" id="sync"></span><button class="linkbtn" data-logout>Esci</button></div>`;
    $('view').innerHTML = `<div style="display:grid;gap:16px">${banner}${views[st.tab](st.day)}${account}</div>`;
    setSync(syncState);
    if (focusId && $(focusId) && focusId.startsWith('g-')) $(focusId).focus();
  }

  function toast(msg, undo) {
    // "Annulla" solo dopo un'eliminazione, così non si annulla per sbaglio altro.
    if (!undo) undoState = null;
    $('undo').hidden = !undo;
    $('toastmsg').textContent = msg;
    $('toast').hidden = false;
    clearTimeout(toast.t);
    toast.t = setTimeout(() => { $('toast').hidden = true; }, 5000);
  }

  // ---------- eventi ----------
  const num = (v) => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('button');
    if (!el) return;
    if (el.dataset.tab || el.dataset.go) {
      st.tab = el.dataset.tab || el.dataset.go;
      try { localStorage.setItem(KEY + ':tab', st.tab); } catch (e) {}
      render(); window.scrollTo(0, 0); return;
    }
    if (el.id === 'prev' || el.id === 'next') {
      const n = el.id === 'prev' ? -1 : 1;
      if (st.tab === 'riepilogo') { const m = addMonths(st.day, n); st.day = monthStart(m) === monthStart(todayIso()) ? todayIso() : m; }
      else st.day = addDays(st.day, n);
      render(); return;
    }
    if (el.id === 'today') { st.day = todayIso(); render(); return; }
    if (el.id === 'undo') { if (undoState) { data = JSON.parse(undoState); undoState = null; save(); render(); } $('toast').hidden = true; return; }
    if (el.dataset.gtype) { st.goalType = el.dataset.gtype; render(); return; }
    if (el.dataset.toggle) { const g = data.goals.find((x) => x.id === el.dataset.toggle); if (g) { g.done = !g.done; commit(); } return; }
    if (el.dataset.del) {
      snapshot();
      if (el.dataset.del === 'phone') delete data.phone[el.dataset.id];
      else data[el.dataset.del] = data[el.dataset.del].filter((x) => x.id !== el.dataset.id);
      commit('Eliminato', true); return;
    }
    if (el.dataset.timer === 'stop') {
      const t = data.timer, min = Math.max(1, Math.round((Date.now() - t.start) / 60000));
      data.work.push({ id: uid(), date: iso(new Date(t.start)), project: t.project, min, note: '' });
      data.timer = null; commit(`Salvati ${hm(min)} su ${t.project}`); return;
    }
    if (el.dataset.hour) { remToggleHour(Number(el.dataset.hour)); return; }
    if (el.dataset.rem) { ({ on: remOn, off: remOff, test: remTest })[el.dataset.rem](); return; }
    if (el.hasAttribute('data-logout')) { (isDirty() ? push() : Promise.resolve()).then(() => sb.auth.signOut()); return; }
    if (el.hasAttribute('data-clear-example')) { snapshot(); data = emptyData(); commit('Esempi cancellati', true); }
  });

  document.addEventListener('input', (ev) => {
    if (!ev.target.id || !ev.target.id.startsWith('pc-')) return;
    let t = 0;
    PHONE_CATS.forEach((_, i) => { t += num($(`pc-${i}-h`).value) * 60 + num($(`pc-${i}-m`).value); });
    $('p-tot').textContent = hm(t);
  });
  document.addEventListener('submit', (ev) => {
    ev.preventDefault();
    const f = ev.target.id;
    if (f === 'f-goal') {
      const text = $('g-text').value.trim(); if (!text) return;
      data.goals.push({ id: uid(), text, type: st.goalType, date: st.goalType === 'day' ? st.day : monday(st.day), done: false });
      commit('Obiettivo aggiunto'); $('g-text').focus();
    } else if (f === 'f-exp') {
      const amount = Math.round(num($('e-amt').value) * 100) / 100;
      if (amount <= 0) { $('e-amt').setCustomValidity('Scrivi un importo maggiore di zero'); $('e-amt').reportValidity(); $('e-amt').setCustomValidity(''); return; }
      data.expenses.push({ id: uid(), date: st.day, amount, cat: $('e-cat').value, note: $('e-note').value.trim() });
      commit(`Spesa di ${eur(amount)} aggiunta`);
    } else if (f === 'f-phone') {
      const cats = {};
      PHONE_CATS.forEach(([name], i) => { const v = Math.round(num($(`pc-${i}-h`).value) * 60 + num($(`pc-${i}-m`).value)); if (v > 0) cats[name] = v; });
      const min = Object.values(cats).reduce((a, b) => a + b, 0);
      if (!min) { toast('Scrivi il tempo di almeno una categoria'); return; }
      const unlocks = Math.round(num($('p-u').value));
      data.phone[st.day] = { min, unlocks: unlocks || null, cats };
      commit('Tempo di utilizzo salvato');
    } else if (f === 'f-work') {
      const min = Math.round(num($('w-h').value) * 60 + num($('w-m').value));
      if (min <= 0) { $('w-m').setCustomValidity('Scrivi quanto tempo hai lavorato'); $('w-m').reportValidity(); $('w-m').setCustomValidity(''); return; }
      data.work.push({ id: uid(), date: st.day, project: $('w-proj').value.trim(), min, note: $('w-note').value.trim() });
      commit(`Aggiunti ${hm(min)}`);
    } else if (f === 'f-timer') {
      data.timer = { start: Date.now(), project: $('t-proj').value.trim() };
      commit('Cronometro avviato');
    }
  });

  document.getElementById('f-login').addEventListener('submit', async (ev) => {
    ev.preventDefault(); ev.stopPropagation();
    const err = $('l-err'); err.hidden = true; $('l-btn').disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email: $('l-email').value.trim(), password: $('l-pass').value });
    $('l-btn').disabled = false;
    if (error) { err.textContent = 'Email o password non corrette.'; err.hidden = false; }
  });

  function showApp(session) {
    const was = userId;
    userId = session ? session.user.id : null;
    $('login').hidden = !!session;
    $('app').hidden = !session;
    if (!session) {
      if (was) { data = emptyData(); try { localStorage.removeItem(KEY); localStorage.removeItem(KEY + ':dirty'); } catch (e) {} }
      return;
    }
    if (was === userId) return;
    render();
    isDirty() ? push() : pull();
    markOpened(); loadReminder();
  }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  sb.auth.onAuthStateChange((_event, session) => setTimeout(() => showApp(session), 0));
})();
</script>
</body>
</html>
